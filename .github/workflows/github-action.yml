name: Github Action
on: push
jobs:
  action:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'
        cache: 'npm'

    - name: Install
      run: npm install

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Archive
      uses: thedoctor0/zip-release@0.7.6
      if: startsWith(github.ref, 'refs/tags/')
      with:
        type: tar
        filename: dist.tar.gz
        path: dist/

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        fail_on_unmatched_files: true
        files: dist.tar.gz
